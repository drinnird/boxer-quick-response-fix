name: Build Boxer Quick Response Patch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout official Morphe patch template
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches-template
          path: template

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Boxer patch to template
        shell: bash
        run: |
          rm -rf template/patches/src/main/kotlin/*
          mkdir -p template/patches/src/main/kotlin/app/boxerpatches/quickresponses
          cp custom/patches/src/main/kotlin/app/boxerpatches/quickresponses/FixQuickResponseBlankLinesPatch.kt \
             template/patches/src/main/kotlin/app/boxerpatches/quickresponses/
          cp custom/patches/build.gradle.kts template/patches/build.gradle.kts
          cp custom/settings.gradle.kts template/settings.gradle.kts

      - name: Build .mpp patch bundle
        working-directory: template
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid

      - name: Collect .mpp
        shell: bash
        run: |
          mkdir -p out
          find template -type f -name '*.mpp' -print -exec cp '{}' out/ \;
          test -n "$(find out -maxdepth 1 -type f -name '*.mpp' -print -quit)"

      - name: Upload Boxer Morphe patch
        uses: actions/upload-artifact@v4
        with:
          name: Boxer-QuickResponses-Morphe-Patch
          path: out/*.mpp
          if-no-files-found: error
